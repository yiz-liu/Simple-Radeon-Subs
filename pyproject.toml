[project]
name = "simple-radeon-subs"
version = "0.1.0"
description = "Generate and translate movie subtitles on AMD Radeon GPUs"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "modelscope>=1.38.1",
    "pysrt>=1.1.2",
    "tqdm>=4.67.3",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.12.0",
]
vllm = [
    "vllm==0.27.1",
]

[tool.uv]
default-groups = []
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
index-strategy = "first-index"
package = false

[[tool.uv.index]]
name = "vllm-rocm"
url = "https://wheels.vllm.ai/rocm/0.27.1/rocm723"

[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.uv.sources]
vllm = { index = "vllm-rocm" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
